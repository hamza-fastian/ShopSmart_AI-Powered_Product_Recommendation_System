<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234f46e5%27/%3E%3Cstop offset=%271%27 stop-color=%27%237c3aed%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M16 6l2.2 6.3L24.5 14.5l-6.3 2.2L16 23l-2.2-6.3L7.5 14.5l6.3-2.2z%27 fill=%27white%27/%3E%3C/svg%3E">
  <title>Log in — ShopSmart</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="login">
  <div id="site-nav"></div>
  <main class="auth-wrap">
    <aside class="auth-aside">
      <h2>Welcome back to smarter shopping.</h2>
      <p>Your recommendations are waiting, ranked for your preferences and budget.</p>
      <div class="auth-points" id="auth-points"></div>
    </aside>
    <section class="auth-main">
      <div class="auth-card">
        <h1>Log in</h1>
        <p>Enter your ShopSmart Customer ID. The backend identifies customers by ID (there are no passwords in the project).</p>
        <div id="form-alert"></div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="cid">Customer ID</label>
            <input class="input" id="cid" name="cid" inputmode="numeric" autocomplete="username" placeholder="e.g. 1001" required>
            <div class="error-text" id="cid-err"></div>
          </div>
          <button class="btn btn-primary btn-block" id="submit" type="submit">Log in</button>
        </form>
        <div class="auth-foot">New to ShopSmart? <a href="signup.html">Create an account</a></div>
      </div>
    </section>
  </main>
  <script src="js/icons.js"></script>
  <script src="js/images.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
