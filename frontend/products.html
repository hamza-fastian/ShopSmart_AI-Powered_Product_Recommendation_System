<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%234f46e5%27/%3E%3Cstop offset=%271%27 stop-color=%27%237c3aed%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M16 6l2.2 6.3L24.5 14.5l-6.3 2.2L16 23l-2.2-6.3L7.5 14.5l6.3-2.2z%27 fill=%27white%27/%3E%3C/svg%3E">
  <title>Products — ShopSmart</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/products.css">
</head>
<body data-page="products">
  <div id="site-nav"></div>
  <main>
    <div class="container page-head">
      <span class="eyebrow">Catalog</span>
      <h1>All products</h1>
      <p id="subtitle">Search, filter and sort the full ShopSmart catalog.</p>
    </div>
    <div class="container">
      <div class="filters">
        <div class="filter-row">
          <div class="search-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input class="input" id="q" type="search" placeholder="Search by product name or brand…" aria-label="Search products">
          </div>
          <select class="input" id="category" aria-label="Category"><option value="">All categories</option></select>
          <select class="input" id="sort" aria-label="Sort">
            <option value="featured">Sort: Catalog order</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name: A to Z</option>
            <option value="rating">Highest rated</option>
            <option value="popular">Most popular</option>
          </select>
          <button class="btn btn-ghost" id="clear" type="button">Clear filters</button>
        </div>
        <div class="cat-pills" id="pills"></div>
      </div>
      <div class="result-bar"><span id="count">Loading products…</span></div>
      <div class="grid product-grid" id="grid"></div>
    </div>
  </main>
  <div style="height:72px"></div>
  <div id="site-footer"></div>
  <script src="js/icons.js"></script>
  <script src="js/images.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
